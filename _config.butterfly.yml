# ==========================================
# Butterfly 主题自定义配置
# 未在此文件出现的配置项，沿用主题默认值
# 主题默认与全部可选项：node_modules/hexo-theme-butterfly/_config.yml
# 官方文档：https://butterfly.js.org/
# ==========================================

# ---------- 顶部导航（菜单）----------
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

# ---------- 社交图标（填上自己的链接后启用）----------
social:
  # fab fa-github: https://github.com/你的用户名 || Github || '#24292e'

# ---------- 代码块 ----------
code_blocks:
  theme: light
  macStyle: true
  copy: true
  language: true

# ---------- 首页副标题（打字机效果）----------
subtitle:
  enable: true
  effect: true
  sub:
    - 记录技术笔记与踩坑日常

# 首页文章摘要长度
index_post_content:
  method: 3
  length: 200

# ---------- 深色模式 ----------
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# ---------- 搜索（本地搜索，无需外部服务）----------
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: true

# ---------- 评论系统：Giscus（基于 GitHub Discussions，免费、无后端）----------
# 启用步骤：
#   1. 在 GitHub 建一个 Public 仓库放博客源码，仓库 Settings 里开启 Discussions
#   2. 打开 https://giscus.app/zh-CN ，填入仓库名，拿到 repo_id 和 category_id
#   3. 填到下面三行，并把 use 改成 giscus
comments:
  use:
  text: true
  lazyload: true
  count: false
  card_post_count: false

giscus:
  repo:
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark

# ---------- 侧栏 ----------
aside:
  card_author:
    enable: true
    description: 记录技术笔记与踩坑日常
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/xxxxxx
  card_announcement:
    enable: true
    content: 这里是我的数字自留地，记录技术笔记、踩坑与思考。

# ---------- 页脚 ----------
footer:
  owner:
    enable: true
    since: 2026

# ---------- 默认显示模式：浅色 ----------
display_mode: light

# ---------- 访问统计 ----------
# 暂关闭 busuanzi 统计（本地预览会显示异常数据）；
# 部署后建议用 Cloudflare 自带的 Web Analytics（免费、无第三方脚本）
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# ---------- 自定义注入 ----------
# Live2D 看板娘（右下角）——资源全部自托管在 source/live2d/ 下，不依赖外部 CDN
# 换模型：改 source/live2d/waifu-tips.json 里的 models 数组
# 调大小：改 source/live2d/live2d-custom.css 顶部的 --waifu-size
# 调位置：同上文件；关闭：把下面的 bottom 那行注释掉即可
#
# ⚠️ 末尾的 ?v= 是缓存版本号。改动 source/live2d/ 下任何文件后，
#    必须同时更新这里的 ?v= 和 source/live2d/autoload.js 里的 ASSET_VERSION，
#    否则浏览器会吃旧缓存，出现「改了但线上没变」。
inject:
  head:
  bottom:
    - <script src="/live2d/autoload.js?v=20261013d"></script>
